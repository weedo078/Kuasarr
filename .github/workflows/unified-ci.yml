name: Unified CI/CD

on:
  push:
    branches: [kuasarr]
    paths-ignore:
      - '.github/**'
      - 'docker/**'
  pull_request:
    branches: [kuasarr]
  workflow_dispatch:
    inputs:
      skip_pypi:
        description: 'Skip PyPI upload'
        type: boolean
        default: false

env:
  DOCKER_ENDPOINT: "weedo078/kuasarr"
  GHCR_ENDPOINT: "ghcr.io/weedo078/kuasarr"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # DETECT CHANGES
  # ═══════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      version-file: ${{ steps.filter.outputs.version-file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'kuasarr/**'
              - 'setup.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'Kuasarr.py'
              - 'MANIFEST.in'
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - 'kuasarr/**'
              - 'requirements.txt'
            version-file:
              - 'version.json'

  # ═══════════════════════════════════════════════════════════════
  # PR VERSION BUMP CHECK
  # ═══════════════════════════════════════════════════════════════
  check-version:
    name: PR Version Bump Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.version-file == 'true'
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: kuasarr
          path: base

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Compare versions
        run: |
          OLD_VERSION=$(jq -r .version base/version.json)
          NEW_VERSION=$(jq -r .version pr/version.json)
          echo "Old Version: $OLD_VERSION"
          echo "New Version: $NEW_VERSION"
          if [ "$OLD_VERSION" == "$NEW_VERSION" ]; then
            echo "Version has not been bumped!"
            exit 1
          fi
          echo "Version bump OK: $OLD_VERSION → $NEW_VERSION"

  # ═══════════════════════════════════════════════════════════════
  # KIMI CODE REVIEW (PRs only)
  # ═══════════════════════════════════════════════════════════════
  kimi-review:
    name: Kimi Code Review
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.detect-changes.outputs.python == 'true'
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(py|json|toml|cfg|txt|yml|yaml)$' | head -50 || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Kimi Code Review
        id: review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          REVIEW_CONTENT=""
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              REVIEW_CONTENT+=$'\n'"=== $file ==="$'\n'
              REVIEW_CONTENT+=$(head -150 "$file")
            fi
          done <<< "${{ steps.changed-files.outputs.files }}"

          PAYLOAD=$(jq -n \
            --arg content "$REVIEW_CONTENT" \
            '{model: "moonshotai/kimi-k2", messages: [{role: "system", content: "You are a Python code reviewer. Review the following code changes and provide concise, actionable feedback on: 1) Bugs or logic issues 2) Security concerns 3) Performance improvements 4) PEP8/code style. Focus on the most important issues only."}, {role: "user", content: $content}]}')

          RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No review generated"')
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.review }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Kimi Code Review**\n\n${review}\n\n---\n*Powered by Kimi via OpenRouter*`
            });

  # ═══════════════════════════════════════════════════════════════
  # BUILD WHEEL (amd64/pure Python)
  # ═══════════════════════════════════════════════════════════════
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install wheel setuptools
      - name: Build Wheel
        run: python setup.py sdist bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # ═══════════════════════════════════════════════════════════════
  # BUILD WINDOWS EXE
  # ═══════════════════════════════════════════════════════════════
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller build
      - name: Build EXE
        run: |
          python kuasarr/providers/version.py
          pyinstaller --noconfirm --onefile --console --add-data "kuasarr/static;kuasarr/static" --add-data "version.json;." --version-file "file_version_info.txt" --name "kuasarr" Kuasarr.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/kuasarr.exe

  # ═══════════════════════════════════════════════════════════════
  # BUILD DOCKER (amd64 + arm64)
  # ═══════════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: build-wheel
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ./dist

      - name: Get Version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKER_ENDPOINT }}:${{ steps.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.DOCKER_ENDPOINT }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.GHCR_ENDPOINT }}:${{ steps.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.GHCR_ENDPOINT }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

  # ═══════════════════════════════════════════════════════════════
  # CREATE GITHUB RELEASE + PYPI UPLOAD
  # ═══════════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-wheel, build-exe, build-docker]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ./dist

      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: ./dist

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./dist/*.whl,./dist/*.exe"
          body: ${{ steps.changelog.outputs.changelog }}
          tag: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to PyPI
        if: ${{ !inputs.skip_pypi }}
        run: |
          pip install -U twine packaging
          python -m twine upload ./dist/*.whl -u __token__ -p ${{ secrets.PYPI_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # CI SUMMARY
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-wheel, build-exe, build-docker, release, kimi-review, check-version]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Kuasarr CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "- Python/Package: ${{ needs.detect-changes.outputs.python }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.detect-changes.outputs.docker }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version file: ${{ needs.detect-changes.outputs.version-file }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Wheel | ${{ needs.build-wheel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Windows EXE | ${{ needs.build-exe.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker (amd64+arm64) | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release & PyPI | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kimi Code Review | ${{ needs.kimi-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Bump Check | ${{ needs.check-version.result }} |" >> $GITHUB_STEP_SUMMARY
