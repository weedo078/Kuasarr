name: Release
on:
  workflow_dispatch:
    inputs:
      skip_pypi:
        default: false
        description: 'Skip PyPI upload'
        type: boolean
  push:
    paths-ignore:
      - '.github/**'
      - 'docker/**'
    branches:
      - kuasarr

env:
  DOCKER_ENDPOINT: "weedo078/kuasarr"
  GHCR_ENDPOINT: "ghcr.io/weedo078/kuasarr"

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Version
        id: version
        run: |
          echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install build
      - name: Build Wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller build
      - name: Build EXE
        run: |
          python kuasarr/providers/version.py
          pyinstaller --noconfirm --onefile --windowed --add-data "kuasarr/static;kuasarr/static" --add-data "version.json;." --version-file "file_version_info.txt" --name "kuasarr" Kuasarr.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/kuasarr.exe

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [version, build-wheel]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ./dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKER_ENDPOINT }}:${{ needs.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.DOCKER_ENDPOINT }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.GHCR_ENDPOINT }}:${{ needs.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
            ${{ env.GHCR_ENDPOINT }}:latest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-wheel, build-exe, build-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: ./dist
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./dist/*.whl,./dist/*.exe"
          body: ${{ steps.changelog.outputs.changelog }}
          tag: v${{ needs.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to PyPI
        if: ${{ !inputs.skip_pypi }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*.whl
